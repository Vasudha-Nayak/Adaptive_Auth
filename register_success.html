<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Complete</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="wrap">
    <div class="card center">
      <span class="badge good">Account created</span>
      <h1>You're all set, {{ username }}</h1>
      <p class="subtitle">
        Your password is saved and a personal face-recognition model has been trained
        and stored on the server. There's no pattern or code to remember this time —
        just log in with your password, the email OTP, and your face.
      </p>
      <a class="btn" href="{{ url_for('login') }}">Go to login</a>
    </div>
  </div>
</body>
</html>
